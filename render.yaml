services:
  - type: web
    name: simuladoenade
    runtime: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan key:generate --force
      php artisan migrate --force
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromService:
          type: pgsql
          name: simuladorenade-db
          property: host
      - key: DB_PORT
        fromService:
          type: pgsql
          name: simuladorenade-db
          property: port
      - key: DB_DATABASE
        fromService:
          type: pgsql
          name: simuladorenade-db
          property: database
      - key: DB_USERNAME
        fromService:
          type: pgsql
          name: simuladorenade-db
          property: username
      - key: DB_PASSWORD
        fromService:
          type: pgsql
          name: simuladorenade-db
          property: password

  - type: pgsql
    name: simuladorenade-db
    ipAllowList: []
    region: ohio